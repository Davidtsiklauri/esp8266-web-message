<!DOCTYPE HTML>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ESP8266 OLED Control</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
    <div class="card">
        <h2>OLED Controller</h2>

        <div class="msg-container">
            <div class="status-header">
                <span class="status-dot"></span>
                <span class="label">Active Screen Text</span>
            </div>
            <div class="msg-text">"%CURRENT_MSG%"</div>
        </div>

        <form action="/setMessage" method="GET">
            <input type="text" name="msg" placeholder="Type new message..." required maxlength="100" autocomplete="off">
            <button type="submit">Update Message</button>
        </form>

        <form action="/toggleIdle" method="GET">
            <button type="submit" class="btn-secondary">Toggle Clock Mode</button>
        </form>
    </div>
</body>

</html>
